services:
  - type: web
    name: edmw-online-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: RELAY_DATA_DIR
        value: /tmp/edmw-relay
      - key: IDENTITY_SECRET
        generateValue: true
